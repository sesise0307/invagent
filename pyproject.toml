[project]
name = "invagent"
version = "0.2.0"
description = "My personal investment agent."
readme = "README.md"
authors = [
    { name = "Sin-seok Seo", email = "sesise@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "click>=8.1.0",
    "requests>=2.33.1",
    "telethon>=1.42.0",
    "trafilatura>=2.0.0",
]

[project.scripts]
invagent = "invagent.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
